table:
  name: workflow_triggers
  schema: public
object_relationships:
  - name: workflow
    using:
      foreign_key_constraint_on: workflow_id
select_permissions:
  - role: user
    permission:
      columns: '*'
      filter:
        _exists:
          _table:
            name: org_members
            schema: public
          _where:
            user_id:
              _eq: X-Hasura-User-Id
  - role: owner
    permission:
      columns: '*'
      filter:
        workflow:
          _exists:
            _table:
              name: org_members
              schema: public
            _where:
              _and:
                - user_id:
                    _eq: X-Hasura-User-Id
                - org_id:
                    _eq: org_id
                - role:
                    _eq: owner
  - role: editor
    permission:
      columns: '*'
      filter:
        workflow:
          _exists:
            _table:
              name: org_members
              schema: public
            _where:
              _and:
                - user_id:
                    _eq: X-Hasura-User-Id
                - org_id:
                    _eq: org_id
                - role:
                    _eq: editor
  - role: viewer
    permission:
      columns: '*'
      filter:
        workflow:
          _exists:
            _table:
              name: org_members
              schema: public
            _where:
              _and:
                - user_id:
                    _eq: X-Hasura-User-Id
                - org_id:
                    _eq: org_id
                - role:
                    _eq: viewer
insert_permissions:
  - role: owner
    permission:
      columns: '*'
      check:
        workflow:
          _exists:
            _table:
              name: org_members
              schema: public
            _where:
              _and:
                - user_id:
                    _eq: X-Hasura-User-Id
                - org_id:
                    _eq: org_id
                - role:
                    _eq: owner
  - role: editor
    permission:
      columns: '*'
      check:
        _and:
          - type:
              _neq: "webhook"
          - workflow:
              _exists:
                _table:
                  name: org_members
                  schema: public
                _where:
                  _and:
                    - user_id:
                        _eq: X-Hasura-User-Id
                    - org_id:
                        _eq: org_id
                    - role:
                        _eq: editor
update_permissions:
  - role: owner
    permission:
      columns: '*'
      filter:
        workflow:
          _exists:
            _table:
              name: org_members
              schema: public
            _where:
              _and:
                - user_id:
                    _eq: X-Hasura-User-Id
                - org_id:
                    _eq: org_id
                - role:
                    _eq: owner
  - role: editor
    permission:
      columns: '*'
      filter:
        workflow:
          _exists:
            _table:
              name: org_members
              schema: public
            _where:
              _and:
                - user_id:
                    _eq: X-Hasura-User-Id
                - org_id:
                    _eq: org_id
                - role:
                    _eq: editor
delete_permissions:
  - role: owner
    permission:
      filter:
        workflow:
          _exists:
            _table:
              name: org_members
              schema: public
            _where:
              _and:
                - user_id:
                    _eq: X-Hasura-User-Id
                - org_id:
                    _eq: org_id
                - role:
                    _eq: owner
  - role: editor
    permission:
      filter:
        workflow:
          _exists:
            _table:
              name: org_members
              schema: public
            _where:
              _and:
                - user_id:
                    _eq: X-Hasura-User-Id
                - org_id:
                    _eq: org_id
                - role:
                    _eq: editor
