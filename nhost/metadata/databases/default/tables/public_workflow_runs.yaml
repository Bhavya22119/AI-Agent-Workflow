table:
  name: workflow_runs
  schema: public
object_relationships:
  - name: organization
    using:
      foreign_key_constraint_on: org_id
  - name: workflow
    using:
      foreign_key_constraint_on: workflow_id
array_relationships:
  - name: step_runs
    using:
      foreign_key_constraint_on:
        column: workflow_run_id
        table:
          name: step_runs
          schema: public
  - name: workflow_outputs
    using:
      foreign_key_constraint_on:
        column: workflow_run_id
        table:
          name: workflow_outputs
          schema: public
select_permissions:
  - role: owner
    permission:
      columns: '*'
      filter:
        _exists:
          _table:
            name: org_members
            schema: public
          _where:
            _and:
              - user_id:
                  _eq: X-Hasura-User-Id
              - org_id:
                  _eq: org_id
              - role:
                  _eq: owner
  - role: editor
    permission:
      columns: '*'
      filter:
        _exists:
          _table:
            name: org_members
            schema: public
          _where:
            _and:
              - user_id:
                  _eq: X-Hasura-User-Id
              - org_id:
                  _eq: org_id
              - role:
                  _eq: editor
  - role: viewer
    permission:
      columns: '*'
      filter:
        _exists:
          _table:
            name: org_members
            schema: public
          _where:
            _and:
              - user_id:
                  _eq: X-Hasura-User-Id
              - org_id:
                  _eq: org_id
              - role:
                  _eq: viewer
