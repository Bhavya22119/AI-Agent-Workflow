table:
  name: workflow_runs
  schema: public
object_relationships:
  - name: organization
    using:
      foreign_key_constraint_on: org_id
  - name: workflow
    using:
      foreign_key_constraint_on: workflow_id
array_relationships:
  - name: step_runs
    using:
      foreign_key_constraint_on:
        column: workflow_run_id
        table:
          name: step_runs
          schema: public
  - name: workflow_outputs
    using:
      foreign_key_constraint_on:
        column: workflow_run_id
        table:
          name: workflow_outputs
          schema: public
select_permissions:
  - role: user
    permission:
      columns: '*'
      filter:
        organization:
          org_members:
              user_id:
                _eq: X-Hasura-User-Id
  - role: owner
    permission:
      columns: '*'
      filter:
        organization:
          org_members:
            _and:
              - user_id:
                  _eq: X-Hasura-User-Id
              - role:
                  _eq: owner
  - role: editor
    permission:
      columns: '*'
      filter:
        organization:
          org_members:
            _and:
              - user_id:
                  _eq: X-Hasura-User-Id
              - role:
                  _eq: editor
  - role: viewer
    permission:
      columns: '*'
      filter:
        organization:
          org_members:
            _and:
              - user_id:
                  _eq: X-Hasura-User-Id
              - role:
                  _eq: viewer
