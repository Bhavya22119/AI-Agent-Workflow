table:
  name: workflow_steps
  schema: public
object_relationships:
  - name: workflow
    using:
      foreign_key_constraint_on: workflow_id
array_relationships:
  - name: step_runs
    using:
      foreign_key_constraint_on:
        column: workflow_step_id
        table:
          name: step_runs
          schema: public
select_permissions:
  - role: owner
    permission:
      columns: '*'
      filter:
        workflow:
          _exists:
            _table:
              name: org_members
              schema: public
            _where:
              _and:
                - user_id:
                    _eq: X-Hasura-User-Id
                - org_id:
                    _eq: org_id
                - role:
                    _eq: owner
  - role: editor
    permission:
      columns: '*'
      filter:
        workflow:
          _exists:
            _table:
              name: org_members
              schema: public
            _where:
              _and:
                - user_id:
                    _eq: X-Hasura-User-Id
                - org_id:
                    _eq: org_id
                - role:
                    _eq: editor
  - role: viewer
    permission:
      columns: '*'
      filter:
        workflow:
          _exists:
            _table:
              name: org_members
              schema: public
            _where:
              _and:
                - user_id:
                    _eq: X-Hasura-User-Id
                - org_id:
                    _eq: org_id
                - role:
                    _eq: viewer
insert_permissions:
  - role: owner
    permission:
      columns: '*'
      check:
        workflow:
          _exists:
            _table:
              name: org_members
              schema: public
            _where:
              _and:
                - user_id:
                    _eq: X-Hasura-User-Id
                - org_id:
                    _eq: org_id
                - role:
                    _eq: owner
  - role: editor
    permission:
      columns: '*'
      check:
        _and:
          - type:
              _nin: ["db_write", "notify"]
          - workflow:
              _exists:
                _table:
                  name: org_members
                  schema: public
                _where:
                  _and:
                    - user_id:
                        _eq: X-Hasura-User-Id
                    - org_id:
                        _eq: org_id
                    - role:
                        _eq: editor
