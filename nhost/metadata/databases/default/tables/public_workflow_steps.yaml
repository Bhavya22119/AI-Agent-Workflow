    permission:
      columns: '*'
      filter:
        workflow:
          _exists:
            _table:
              name: org_members
              schema: public
            _where:
              _and:
                - user_id:
                    _eq: X-Hasura-User-Id
                - org_id:
                    _eq: org_id
                - role:
                    _eq: owner
  - role: editor
    permission:
      columns: '*'
      filter:
        _and:
          - type:
              _nin: ["db_write", "notify"]
          - workflow:
              _exists:
                _table:
                  name: org_members
                  schema: public
                _where:
                  _and:
                    - user_id:
                        _eq: X-Hasura-User-Id
                    - org_id:
                        _eq: org_id
                    - role:
                        _eq: editor
delete_permissions:
  - role: owner
    permission:
      filter:
        workflow:
          _exists:
            _table:
              name: org_members
              schema: public
            _where:
              _and:
                - user_id:
                    _eq: X-Hasura-User-Id
                - org_id:
                    _eq: org_id
                - role:
                    _eq: owner
  - role: editor
    permission:
      filter:
        workflow:
          _exists:
            _table:
              name: org_members
              schema: public
            _where:
              _and:
                - user_id:
                    _eq: X-Hasura-User-Id
                - org_id:
                    _eq: org_id
                - role:
                    _eq: editor
