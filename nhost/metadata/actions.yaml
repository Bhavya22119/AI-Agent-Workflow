actions:
  - name: triggerWorkflowRun
    definition:
      kind: synchronous
      handler: '{{NHOST_FUNCTIONS_URL}}/trigger-workflow-run'
      forward_client_headers: true
    permissions:
      - role: owner
      - role: editor
  - name: approveStep
    definition:
      kind: synchronous
      handler: '{{NHOST_FUNCTIONS_URL}}/approve-step'
      forward_client_headers: true
    permissions:
      - role: owner
      - role: editor
  - name: invokeWorkflowWebhook
    definition:
      kind: synchronous
      handler: '{{NHOST_FUNCTIONS_URL}}/invoke-workflow-webhook'
    permissions: []
custom_types:
  input_objects: []
  objects:
    - name: TriggerWorkflowRunOutput
      fields:
        - name: workflow_run_id
          type: uuid!
        - name: status
          type: String!
    - name: ApproveStepOutput
      fields:
        - name: workflow_run_id
          type: uuid!
        - name: status
          type: String!
